apiVersion: v1
kind: LimitRange
metadata:
  name: boinc-worker-budget
  namespace: boinc-pilot
spec:
  limits:
  - type: Container
    max:
      cpu: '2'
      memory: 2Gi
    default:
      cpu: '2'
      memory: 2Gi
    defaultRequest:
      cpu: 25m
      memory: 2Gi
  - type: Pod
    max:
      cpu: '2'
      memory: 2Gi
  - type: PersistentVolumeClaim
    max:
      storage: 8Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: boinc-total-budget
  namespace: boinc-pilot
spec:
  hard:
    pods: '2'
    limits.cpu: '4'
    limits.memory: 4Gi
    requests.cpu: 50m
    requests.memory: 4Gi
    requests.gpu.intel.com/i915: '1'
    persistentvolumeclaims: '2'
    requests.storage: 16Gi
